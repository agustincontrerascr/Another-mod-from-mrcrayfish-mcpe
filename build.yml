name: Build BlockLauncher (tile render API)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Instalar Ant y utilidades de 32 bits
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y ant libc6:i386 libstdc++6:i386 zlib1g:i386

      - name: Ejecutar script de build
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BlockLauncher-debug-apk
          path: deps/**/bin/*-debug.apk
          if-no-files-found: error
